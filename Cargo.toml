[workspace]
members = [
  "crates/vexnas-proto",
  "crates/vexnasd",
  "crates/vexnas-web",
  "crates/vexnas-frontend",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
vexnas-proto = { path = "crates/vexnas-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
